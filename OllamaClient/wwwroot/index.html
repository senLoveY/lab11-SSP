<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ollama Lab</title>
  <link rel="stylesheet" href="app.css">
  <script src="vendor/marked.js" defer></script>
  <script src="markdown.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <div><strong>Ollama Lab</strong><small>Локальные LLM · C#</small></div>
    </div>

    <nav class="modes" aria-label="Режим работы">
      <button type="button" data-mode="generate" aria-pressed="true">Генерация</button>
      <button type="button" data-mode="chat" aria-pressed="false">Чат</button>
      <button type="button" data-mode="review" aria-pressed="false">Ревью</button>
      <button type="button" data-mode="pipeline" aria-pressed="false">Конвейер</button>
    </nav>

    <div class="server">
      <div class="connection" data-state="pending">
        <span class="dot" aria-hidden="true"></span>
        <strong id="connection-status" role="status">Подключение к Ollama</strong>
      </div>
      <span id="server-address" class="server-address"></span>
      <button id="refresh" class="button secondary" type="button">Обновить модели</button>
    </div>
  </aside>

  <main class="chat-shell">
    <header class="chat-header">
      <div class="chat-header-inner">
        <div class="intro">
          <h1 id="mode-title">Генерация кода</h1>
          <p id="mode-description">Попроси модель написать метод или объяснить решение.</p>
        </div>
        <div class="model-fields">
          <label class="field">
            <span id="model-label">Модель</span>
            <select id="model" disabled><option value="">Загрузка моделей…</option></select>
          </label>
          <label id="review-model-field" class="field" hidden>
            <span>Модель для ревью</span>
            <select id="review-model" disabled></select>
          </label>
        </div>
        <p id="connection-error" class="notice" role="alert" hidden></p>
      </div>
    </header>

    <section id="output-body" class="output-body" tabindex="0" aria-label="Переписка">
      <div id="empty-output" class="empty">
        <span class="empty-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
        <p>Отправь запрос или вставь готовый пример</p>
      </div>
      <div id="messages" class="messages"></div>
    </section>

    <footer class="composer">
      <form id="request" class="composer-inner" aria-label="Запрос к модели">
        <div class="composer-status">
          <p id="run-status" role="status"></p>
          <p id="run-error" class="error" role="alert" hidden></p>
        </div>
        <label class="field prompt-field">
          <span id="prompt-label">Что нужно написать?</span>
          <textarea id="prompt" rows="2" required placeholder="Например, напиши метод C# для поиска максимума."></textarea>
        </label>
        <div class="composer-actions">
          <div class="composer-tools">
            <button id="example" class="button secondary" type="button">Вставить пример</button>
            <button id="clear-chat" class="button quiet" type="button">Очистить чат</button>
          </div>
          <div class="send-actions">
            <label id="stream-field" class="stream">
              <input id="stream" type="checkbox" checked>
              <span>Потоковый вывод</span>
            </label>
            <button id="stop" class="button secondary" type="button" hidden>Остановить</button>
            <button id="run" class="button primary" type="submit" disabled>Сгенерировать</button>
          </div>
        </div>
      </form>
    </footer>
  </main>
</body>
</html>
